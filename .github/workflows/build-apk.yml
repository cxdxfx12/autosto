name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses & install SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-33" "build-tools;33.0.1"

      - name: Point Gradle to Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK (Gradle 8.4)
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4
          build-root-directory: android
          arguments: assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sto-collector-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
